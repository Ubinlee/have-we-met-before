<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>본 적 있나? 초대</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f9f7ff; color: #191721; }
    main { width: min(100%, 420px); padding: 32px 24px; border: 1px solid #e5dff4; border-radius: 20px; background: #fff; text-align: center; box-shadow: 0 16px 50px rgba(84, 60, 140, .10); }
    .mark { margin: 0 auto 24px; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 50%; background: #eee8ff; color: #7048df; font-size: 30px; }
    h1 { margin: 0 0 10px; font-size: 26px; }
    p { margin: 0; color: #716b7e; line-height: 1.55; }
    .code { margin: 28px 0; font: 700 28px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .22em; color: #7048df; }
    a { display: flex; align-items: center; justify-content: center; width: 100%; height: 52px; border-radius: 12px; font-weight: 700; text-decoration: none; }
    #open-app { background: #7048df; color: #fff; }
    #install { margin-top: 12px; background: #eee8ff; color: #5733bd; }
    .hint { margin-top: 20px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="mark">✦</div>
    <h1>친구가 초대했어요</h1>
    <p>앱을 열면 초대 코드가 자동으로 입력돼요.</p>
    <div class="code" id="code">------</div>
    <a id="open-app" href="#">본 적 있나? 열기</a>
    <a id="install" href="https://apps.apple.com/app/testflight/id899247664">TestFlight 설치하기</a>
    <p class="hint">앱이 설치되어 있지 않다면 TestFlight를 설치한 뒤 팀 초대에서 앱을 받아 주세요.</p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const raw = (params.get('code') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
    const valid = raw.length === 6;
    const appURL = valid ? `havewemetbefore://invite?code=${encodeURIComponent(raw)}` : 'havewemetbefore://invite';
    document.getElementById('code').textContent = valid ? raw : '코드 오류';
    document.getElementById('open-app').href = appURL;
    if (valid) {
      setTimeout(() => { location.href = appURL; }, 250);
    }
  </script>
</body>
</html>
